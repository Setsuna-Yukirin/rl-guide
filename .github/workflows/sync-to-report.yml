name: Sync to Report

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rl-guide
        uses: actions/checkout@v4

      - name: Checkout report
        uses: actions/checkout@v4
        with:
          repository: Setsuna-Yukirin/report
          token: ${{ secrets.REPORT_TOKEN }}
          path: report

      - name: Sync files to report/docs/rl-guide
        run: |
          rm -rf report/docs/rl-guide
          mkdir -p report/docs/rl-guide

          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='.pylintrc' \
            --exclude='pyproject.toml' \
            --exclude='Makefile' \
            --exclude='requirements.txt' \
            --exclude='scripts' \
            --exclude='tests' \
            --exclude='.gitignore' \
            --exclude='docs' \
            --exclude='report' \
            ./ report/docs/rl-guide/

      - name: Update mkdocs.yml nav
        run: |
          cd report
          python3 << 'PYEOF'
          import re, os

          with open("mkdocs.yml", "r") as f:
              content = f.read()

          # --- 自动生成 rl-guide nav 条目 ---
          rl_guide_dir = "docs/rl-guide"
          title_map = {
              "01": "MDP 基础", "02": "动态规划", "03": "蒙特卡洛",
              "04": "时序差分", "05": "函数逼近", "06": "策略梯度", "07": "高级策略"
          }

          chapter_lines = []
          for d in sorted(os.listdir(rl_guide_dir)):
              readme = os.path.join(rl_guide_dir, d, "README.md")
              if os.path.isfile(readme) and d.startswith("chapter_"):
                  num = d.split("_")[1]
                  title = title_map.get(num, d)
                  chapter_lines.append(f'    - "第 {int(num)} 章 - {title}": rl-guide/{d}/README.md')

          chapters_yaml = '\n'.join(chapter_lines)

          # 构建完整的 rl-guide nav 块
          rl_guide_block = f'  - 强化学习教程:\n{chapters_yaml}'

          # 替换已有的强化学习教程 nav 块
          pattern = r'  - 强化学习教程:\n(?:    - .*\n)*'
          if re.search(pattern, content):
              content = re.sub(pattern, rl_guide_block + '\n', content)
          else:
              # 在 nav: 块的最后一个条目后追加
              # 找到 nav: 块，在其最后一个顶级条目后插入
              nav_pattern = r'(nav:\n(?:.*\n)*?)(extra:)'
              match = re.search(nav_pattern, content)
              if match:
                  nav_block = match.group(1)
                  extra_block = match.group(2)
                  # 在 nav 块末尾追加 rl-guide
                  new_nav = nav_block.rstrip() + '\n' + rl_guide_block + '\n\n'
                  content = content[:match.start()] + new_nav + extra_block + content[match.end():]

          with open("mkdocs.yml", "w") as f:
              f.write(content)

          print("✅ mkdocs.yml nav updated")
          PYEOF

      - name: Commit and push to report
        run: |
          cd report
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git add -A
            git commit -m "sync: update rl-guide from $(cd .. && git rev-parse --short HEAD)"
            git push
            echo "✅ Pushed to report"
          fi
