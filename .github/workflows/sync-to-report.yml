name: Sync to Report

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rl-guide
        uses: actions/checkout@v4

      - name: Checkout report
        uses: actions/checkout@v4
        with:
          repository: Setsuna-Yukirin/report
          token: ${{ secrets.REPORT_TOKEN }}
          path: report

      - name: Sync files to report/docs/rl-guide
        run: |
          rm -rf report/docs/rl-guide
          mkdir -p report/docs/rl-guide

          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='.pylintrc' \
            --exclude='pyproject.toml' \
            --exclude='Makefile' \
            --exclude='requirements.txt' \
            --exclude='scripts' \
            --exclude='tests' \
            --exclude='.gitignore' \
            ./ report/docs/rl-guide/

      - name: Update mkdocs.yml
        run: |
          cd report
          python3 << 'PYEOF'
          import re, os

          with open("mkdocs.yml", "r") as f:
              content = f.read()

          # --- 1. 自动生成 rl-guide nav ---
          rl_guide_dir = "docs/rl-guide"
          title_map = {
              "01": "MDP 基础", "02": "动态规划", "03": "蒙特卡洛",
              "04": "时序差分", "05": "函数逼近", "06": "策略梯度", "07": "高级策略"
          }

          chapters_yaml = ""
          for d in sorted(os.listdir(rl_guide_dir)):
              readme = os.path.join(rl_guide_dir, d, "README.md")
              if os.path.isfile(readme) and d.startswith("chapter_"):
                  num = d.split("_")[1]
                  title = title_map.get(num, d)
                  chapters_yaml += f'        - "第 {int(num)} 章 - {title}": "rl-guide/{d}/README.md"\n'

          rl_guide_block = f'  - 强化学习教程:\n{chapters_yaml}'

          # 替换已有的 rl-guide nav 或追加
          pattern = r'  - 强化学习教程:.*?(?=\n  - |\n\Z)'
          if re.search(pattern, content, re.DOTALL):
              content = re.sub(pattern, rl_guide_block.rstrip(), content, flags=re.DOTALL)
          else:
              # 在 nav 块末尾追加
              content = content.rstrip() + '\n' + rl_guide_block

          # --- 2. 添加 arithmatex（如果没有）---
          if 'pymdownx.arithmatex' not in content:
              content = content.replace(
                  '  - tables\n',
                  '  - tables\n  - pymdownx.arithmatex:\n      generic: true\n'
              )

          # --- 3. 添加 MathJax extra_javascript（如果没有）---
          if 'mathjax' not in content.lower():
              # 在 extra: 块之前插入 extra_javascript
              mathjax_block = (
                  'extra_javascript:\n'
                  '  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js\n'
                  '  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js?config=TeX-AMS-MML_HTMLorMML\n\n'
              )
              content = content.replace('extra:\n', mathjax_block + 'extra:\n')

          with open("mkdocs.yml", "w") as f:
              f.write(content)

          print("✅ mkdocs.yml updated")
          PYEOF

      - name: Commit and push to report
        run: |
          cd report
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git add -A
            git commit -m "sync: update rl-guide from $(cd .. && git rev-parse --short HEAD)"
            git push
            echo "✅ Pushed to report"
          fi
